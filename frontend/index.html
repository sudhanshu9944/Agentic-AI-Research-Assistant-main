<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔬</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Research Assistant</title>
    <!-- Reference-inspired typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('researchai.theme.v1') === 'dark' ? 'dark' : 'light';
      } catch (_) {}
    </script>
    <style>
      /* Match the application background before JavaScript loads. */
      html,
      body {
        background-color: #ffffff;
        margin: 0;
        padding: 0;
        font-family: 'Poppins', system-ui, sans-serif;
        color: #111111;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background-color: #16131c;
        color: #f5effc;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
