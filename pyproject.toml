[project]
name = "agentic-ai-research-assistant"
version = "1.0.0"
description = "Research assistant with selectable scope, source review and explicit PDF export"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sudhanshu Singh" }
]

dependencies = [
    "fastapi==0.161.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "langgraph==1.2.16",
    "langchain-core==1.7.0",
    "langchain-openai==1.7.2",
    "httpx==0.28.1",
    "ddgs==9.16.0",
    "fpdf2==2.8.9",
    "uharfbuzz==0.56.4",
    "pypdf==6.21.2",
    "Pillow==13.0.0",
    "tenacity==9.2.1",
    "tiktoken==0.14.0",
    "vercel-blob==0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff==0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.fastapi.static]
cdn = true
exclude = true
