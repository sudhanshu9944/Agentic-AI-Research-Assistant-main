[project]
name = "agentic-ai-research-assistant"
version = "1.0.0"
description = "Research assistant with selectable scope, source review and explicit PDF export"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sudhanshu Singh" }
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "httpx>=0.27",
    "ddgs>=9.16,<10",
    "fpdf2>=2.8",
    "uharfbuzz>=0.39",
    "pypdf>=5.0",
    "Pillow>=10.0",
    "tenacity>=9.0",
    "tiktoken>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff==0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
